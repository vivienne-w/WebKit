<!DOCTYPE html><!-- webkit-test-runner [ SourceBufferChangeTypeEnabled=true ] -->
<html>

<head>
  <title>media-source-sample-overlap</title>
  <script src="mock-media-source.js"></script>
  <script src="../video-test.js"></script>
  <script>
    var source;
    var sourceBuffer;
    var initSegment;
    var mediaSegment;

    if (window.internals)
      internals.initializeMockMediaSource();

    window.addEventListener('load', async event => {
      findMediaElement();

      source = new MediaSource();
      run('video.src = URL.createObjectURL(source)');
      await waitFor(source, 'sourceopen');

      run('sourceBuffer = source.addSourceBuffer("video/mock; codecs=mock")');
      mediaSegment = concatenateSamples([
        makeAInit(2, [makeATrack(1, 'mock', TRACK_KIND.AUDIO)]),

        makeASample(0, 0, 9, 1000, 1, SAMPLE_FLAG.SYNC, 0),
        makeASample(9, 9, 9, 1000, 1, SAMPLE_FLAG.SYNC, 0),
        makeASample(18, 18, 9, 1000, 1, SAMPLE_FLAG.SYNC, 0),
        makeASample(27, 27, 9, 1000, 1, SAMPLE_FLAG.SYNC, 0),
        makeASample(36, 36, 9, 1000, 1, SAMPLE_FLAG.SYNC, 0),
      ]);
      run('sourceBuffer.appendBuffer(mediaSegment)');
      await waitFor(sourceBuffer, 'update');
      await waitFor(sourceBuffer, 'updateend');

      bufferedSamples = await internals.bufferedSamplesForTrackId(sourceBuffer, 1);
      bufferedSamples.forEach(consoleWrite);

      mediaSegment = concatenateSamples([
        makeASample(17, 17, 10, 1000, 1, SAMPLE_FLAG.SYNC, 1),
        makeASample(27, 27, 10, 1000, 1, SAMPLE_FLAG.SYNC, 1),
        makeASample(37, 37, 10, 1000, 1, SAMPLE_FLAG.SYNC, 1),
      ]);
      run('sourceBuffer.appendBuffer(mediaSegment)');
      await waitFor(sourceBuffer, 'update');
      await waitFor(sourceBuffer, 'updateend');

      bufferedSamples = await internals.bufferedSamplesForTrackId(sourceBuffer, 1);
      bufferedSamples.forEach(consoleWrite);

      endTest();
    });
  </script>
</head>

<body>
  <video></video>
</body>

</html>
